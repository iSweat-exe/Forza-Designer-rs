name: Release

# Push a tag like v0.2.0 to build installers and create a GitHub release.
on:
  push:
    tags: ['v*.*.*']
  # Manual run: builds the selected branch and creates the tag if it does not exist yet.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/build (e.g. v1.0.0); must match the app version'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match Cargo.toml, package.json and tauri.conf.json
        run: node scripts/version.mjs "${{ steps.tag.outputs.tag }}"

  # Run the whole test suite before shipping anything.
  test:
    name: Tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.name }})
    needs: [verify, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Injection only works on Windows; the Linux build can generate and save shapes.
          - { name: Windows, os: windows-latest, args: '--bundles nsis' }
          - { name: Linux, os: ubuntu-22.04, args: '--bundles appimage,deb' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Forza Designer ${{ needs.verify.outputs.tag }}
          releaseBody: |
            Windows: run the installer. Injection needs the game and this app to run as Administrator.
            Linux builds can generate and save shapes, but cannot inject (Windows only).
            See the README for the workflow and the known limitations.
          releaseDraft: false
          prerelease: ${{ contains(needs.verify.outputs.tag, '-') }}
          args: ${{ matrix.args }}
